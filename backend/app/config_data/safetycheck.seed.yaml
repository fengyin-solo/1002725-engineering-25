# 安全巡检示例数据：部署时按这一份初始化内存仓库，两个环境得到相同的初始结论。
#
# 这里的区域、检查要点、隐患等级都用 safetycheck.yaml 里的稳定编码引用；
# 启动时会校验：引用的编码都存在、归属区域正确、整改期限与「巡检日期 + 等级默认天数」
# 一致。任何一处对不上都会直接报错并指出是哪一条记录的哪一项。
#
# 幂等：重复导入配置或重复初始化，不会覆盖已有的巡检记录（按巡检编号判重）。
records:
  - 巡检编号: SAFE-0001
    区域: apron
    巡检日期: "2026-09-01"
    巡检人员: 王建国
    状态: 待巡检
    检查要点: []

  - 巡检编号: SAFE-0002
    区域: yard
    巡检日期: "2026-09-02"
    巡检人员: 李晓敏
    状态: 待整改
    检查要点:
      - yard-01
      - yard-03
    隐患等级: major
    发现隐患: 危品箱隔离距离不足，且邻近消防通道被空箱占用
    整改措施: 立即倒箱恢复安全间距，清空消防通道并复查
    # 2026-09-02 + 重大隐患 1 天 = 2026-09-03
    整改期限: "2026-09-03"

  - 巡检编号: SAFE-0003
    区域: gate
    巡检日期: "2026-09-03"
    巡检人员: 陈志强
    状态: 已闭合
    检查要点:
      - gate-02
    隐患等级: minor
    发现隐患: 一处人车分流地面标线磨损
    整改措施: 重新施划标线并增设引导标识
    # 2026-09-03 + 轻微隐患 15 天 = 2026-09-18
    整改期限: "2026-09-18"
